SPECIFICATION Spec

\* Reaching a state with nothing left to do (every modeled object created
\* then fully removed, so Grant/CopyCap/TransferCap/Revoke/RemoveCap are all
\* disabled) is expected given a finite object pool -- not a real deadlock
\* to flag, just an artifact of bounding Objects for model checking.
CHECK_DEADLOCK FALSE

CONSTANTS
    Objects = {o1, o2}
    Procs = {p1, p2}
    Slots = {s1, s2}
    MaxGeneration = 1

INVARIANT TypeOK
INVARIANT RightsMonotonicity
